<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/moidoctar-logo.svg" />
    <meta name="theme-color" content="#f6f8fd" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-Powered Health Triage Dashboard" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>MoiDoctar | Health Triage Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Quicksand:wght@300..700&display=swap" rel="stylesheet" />
    <script>
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var key = 'moidoctar_asset_reload';
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, '1');
            window.location.reload(true);
          }
        }
      }, true);
      window.addEventListener('load', function() {
        sessionStorage.removeItem('moidoctar_asset_reload');
      });
    </script>
  </head>

  <body>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('doctarr_theme');
          var dark = mode === 'dark' || ((mode !== 'light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.body.classList.add(theme);
          var raw = localStorage.getItem('doctarr_theme_vars');
          var bg = dark ? '#0f1524' : '#f6f8fd';
          if (raw) {
            var saved = JSON.parse(raw), vars = saved[theme] || {};
            for (var k in vars) document.body.style.setProperty(k, vars[k]);
            if (saved.bg && saved.bg[theme]) bg = saved.bg[theme];
          }
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', bg);
        } catch (e) {
          document.body.classList.add('light');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
